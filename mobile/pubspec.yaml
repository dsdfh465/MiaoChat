name: miaochat
description: 妙语记账 - AI语音记账，说句话的事儿
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  dio: ^5.4.0
  floor: ^1.4.2
  sqflite: ^2.3.0
  vosk_flutter: ^0.3.48
  # vosk_flutter 约束 permission_handler ^10；release 构建需更高版本去掉 v1 embedding
  permission_handler: ^10.4.5
  path_provider: ^2.0.0
  go_router: ^13.0.0
  # 系统分享/保存导出 CSV（保留 UTF-8 BOM，Excel 中文不乱码）
  share_plus: ^10.0.0

dependency_overrides:
  permission_handler: ^12.0.1
  permission_handler_android: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  floor_generator: ^1.4.2
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

# floor/sqflite 会拉取 sqlite3 native assets；本机无法从 GitHub 下载预编译 DLL，改用系统 SQLite。
hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3
      name: sqlite3
